name: KinoDrop

options:
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: 4.0.0

targets:
  KinoDrop:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KinoDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faisalhusayn.kinodrop
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSCameraUsageDescription: KinoDrop uses the camera to scan the connection QR code.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: KinoDrop connects directly to your KinoDrop Windows PC on the local network.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: KinoDrop saves downloaded photos and videos to your Photos library.
    dependencies:
      - package: AMSMB2
