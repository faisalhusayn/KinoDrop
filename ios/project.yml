name: KinoDrop

options:
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AMSMB2:
    path: Dependencies/AMSMB2

targets:
  KinoDrop:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: KinoDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faisalhusayn.kinodrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: KinoDrop uses the camera to scan the connection QR code.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: KinoDrop connects directly to your KinoDrop Windows PC on the local network.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: KinoDrop saves downloaded photos and videos to your Photos library.
    dependencies:
      - package: AMSMB2
