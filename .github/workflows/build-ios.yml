name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KinoDrop.xcodeproj \
            -scheme KinoDrop \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KinoDrop-xcodebuild-log
          path: ios/xcodebuild.log

      - name: Publish compiler diagnostics
        if: failure()
        working-directory: ios
        run: |
          if [ -f xcodebuild.log ]; then
            echo "### xcodebuild diagnostics" >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 20 xcodebuild.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error file=ios/xcodebuild.log::$diagnostic"
          fi

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KinoDrop.app Payload/
          zip -r KinoDrop.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinoDrop-ipa
          path: ios/KinoDrop.ipa
